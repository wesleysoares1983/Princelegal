name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    # Mesmo banco descartavel do docker-compose.dev.yml (PostgreSQL 14, como o servidor corporativo).
    services:
      db-teste:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: princelegal_teste
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U teste -d princelegal_teste"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Dependencias de producao sem vulnerabilidade alta/critica
        run: npm audit --omit=dev --audit-level=high

      - name: Tipos
        run: npm run typecheck

      - name: Migracoes em dia com o esquema
        run: npx drizzle-kit check

      - name: Testes de unidade
        run: npm test

      - name: Testes de banco
        run: npm run test:banco

      - name: Build
        run: npm run build

      - name: Build do worker
        run: npm run worker:build

  # A imagem de producao (Dockerfile) compila e nao traz vulnerabilidade
  # alta/critica com correcao disponivel. No servidor ela e construida de novo
  # (docker compose up -d --build); aqui so se confere.
  imagem:
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t contratos-juridicos:ci .

      - name: Varredura da imagem (Trivy)
        # Fixado no commit (v0.36.0), nao na tag: tags de action podem ser movidas.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: contratos-juridicos:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
